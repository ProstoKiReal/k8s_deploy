name: Deploy to VPS

# Manual "deploy button". It builds nothing — it pulls the prebuilt GHCR images
# (published by dreamescape_ai / llm_api_agent on push to master) onto the VPS
# over an ephemeral WireGuard tunnel and restarts the stack. Every value that
# could "spoil an env" lives in GitHub Secrets; nothing sensitive is committed.
#
# One-time setup: see docs/DEPLOY.md (publish the images, add the WireGuard peer
# + SSH key on the VPS, and set the GitHub Secrets listed there).

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "GHCR image tag to deploy (both apps). Default: latest"
        default: "latest"
        required: false
      deploy_dir:
        description: "Absolute deploy directory on the VPS"
        default: "/opt/scripulya"
        required: false

permissions:
  contents: read

concurrency:
  group: vps-deploy
  cancel-in-progress: false

env:
  GHCR_OWNER: scripulya-ai-roleplay

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Checkout backend (for scripts/init.sql only)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GHCR_OWNER }}/dreamescape_ai
          path: ai-src
          sparse-checkout: |
            scripts

      # ── 1. WireGuard tunnel ──────────────────────────────────────────────
      # All WG topology comes from Secrets, so changing endpoint/keys/IPs is a
      # secret edit, not a workflow edit.
      - name: Bring up WireGuard tunnel
        env:
          WG_PRIVATE_KEY:      ${{ secrets.WG_PRIVATE_KEY }}
          WG_ADDRESS:          ${{ secrets.WG_ADDRESS }}
          WG_PEER_PUBLIC_KEY:  ${{ secrets.WG_PEER_PUBLIC_KEY }}
          WG_PRESHARED_KEY:    ${{ secrets.WG_PRESHARED_KEY }}
          WG_ENDPOINT:         ${{ secrets.WG_ENDPOINT }}
          WG_PEER_ALLOWED_IPS: ${{ secrets.WG_PEER_ALLOWED_IPS }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq wireguard-tools >/dev/null
          cat > /tmp/wg0.conf <<EOF
          [Interface]
          PrivateKey = ${WG_PRIVATE_KEY}
          Address = ${WG_ADDRESS}

          [Peer]
          PublicKey = ${WG_PEER_PUBLIC_KEY}
          $(if [ -n "${WG_PRESHARED_KEY}" ]; then echo "PresharedKey = ${WG_PRESHARED_KEY}"; fi)
          AllowedIPs = ${WG_PEER_ALLOWED_IPS}
          Endpoint = ${WG_ENDPOINT}
          PersistentKeepalive = 25
          EOF
          sudo chmod 600 /tmp/wg0.conf
          sudo wg-quick up /tmp/wg0.conf
          sudo wg show

      - name: Verify tunnel reachability
        env:
          VPS_WG_IP: ${{ secrets.VPS_WG_IP }}
        run: |
          set -euo pipefail
          ping -c 3 -W 3 "$VPS_WG_IP"

      # ── 2. SSH config (key + known_hosts over the tunnel) ────────────────
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          VPS_WG_IP:       ${{ secrets.VPS_WG_IP }}
          VPS_SSH_PORT:    ${{ secrets.VPS_SSH_PORT }}
          VPS_SSH_USER:    ${{ secrets.VPS_SSH_USER }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName ${VPS_WG_IP}
            Port ${VPS_SSH_PORT:-22}
            User ${VPS_SSH_USER:-deploy}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            UserKnownHostsFile ~/.ssh/known_hosts
          EOF
          chmod 600 ~/.ssh/config

      # ── 3. Materialise .env from GitHub Secrets + pin the image refs ─────
      - name: Build transfer bundle (.env + init.sql)
        env:
          JWT_SECRET_KEY:        ${{ secrets.JWT_SECRET_KEY }}
          OPENAI_API_KEY:        ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:     ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY:        ${{ secrets.GEMINI_API_KEY }}
          ZAI_API_KEY:           ${{ secrets.ZAI_API_KEY }}
          DEEPSEEK_API_KEY:      ${{ secrets.DEEPSEEK_API_KEY }}
          IMAGE_API_KEY:         ${{ secrets.IMAGE_API_KEY }}
          MINIO_ROOT_USER:       ${{ secrets.MINIO_ROOT_USER }}
          MINIO_ROOT_PASSWORD:   ${{ secrets.MINIO_ROOT_PASSWORD }}
          MINIO_PUBLIC_ENDPOINT: ${{ secrets.MINIO_PUBLIC_ENDPOINT }}
          # VPS_WG_IP is written into .env so docker-compose.prod.yml can bind the
          # API + MinIO S3 ports to the WireGuard interface (not 0.0.0.0). It must
          # equal the WG IP used for SSH above, and match MINIO_PUBLIC_ENDPOINT's host.
          VPS_WG_IP:             ${{ secrets.VPS_WG_IP }}
          AI_IMAGE:    ghcr.io/${{ env.GHCR_OWNER }}/scripulya-ai:${{ inputs.image_tag }}
          AGENT_IMAGE: ghcr.io/${{ env.GHCR_OWNER }}/scripulya-agent:${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          install -d -m 700 transfer
          {
            echo "# Generated by the Deploy-to-VPS workflow — DO NOT edit by hand."
            echo "DEBUG=false"
            echo "JWT_SECRET_KEY=${JWT_SECRET_KEY}"
            echo "OPENAI_API_KEY=${OPENAI_API_KEY}"
            echo "OPENAI_BASE_URL=https://api.openai.com/v1"
            echo "SUMMARY_ENABLED=true"
            echo "VECTOR_MEMORY_ENABLED=true"
            echo "GRAPH_MEMORY_ENABLED=false"
            echo "ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}"
            echo "GEMINI_API_KEY=${GEMINI_API_KEY}"
            echo "ZAI_API_KEY=${ZAI_API_KEY}"
            echo "ZAI_BASE_URL=https://api.z.ai/api/paas/v4"
            echo "DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}"
            echo "DEEPSEEK_BASE_URL=https://api.deepseek.com"
            echo "IMAGE_API_KEY=${IMAGE_API_KEY}"
            echo "MINIO_ROOT_USER=${MINIO_ROOT_USER}"
            echo "MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}"
            echo "MINIO_PUBLIC_ENDPOINT=${MINIO_PUBLIC_ENDPOINT}"
            echo "VPS_WG_IP=${VPS_WG_IP}"
            echo "MINIO_BUCKET_PUBLIC=scripulya-public"
            echo "MINIO_BUCKET_PRIVATE=scripulya-private"
            echo "SCRIPULYA_AI_IMAGE=${AI_IMAGE}"
            echo "SCRIPULYA_AGENT_IMAGE=${AGENT_IMAGE}"
          } > transfer/.env
          chmod 600 transfer/.env
          cp ai-src/scripts/init.sql transfer/init.sql
          echo "Bundled .env + init.sql for tag=${{ inputs.image_tag }}"

      # ── 4. Sync files to the VPS ────────────────────────────────────────
      - name: Sync compose, env and init.sql to VPS
        env:
          DEPLOY_DIR: ${{ inputs.deploy_dir }}
        run: |
          set -euo pipefail
          ssh vps "mkdir -p '$DEPLOY_DIR/scripts'"
          rsync -az transfer/.env transfer/init.sql \
            docker-compose.yml docker-compose.prod.yml \
            vps:"$DEPLOY_DIR/"
          rsync -az scripts/deploy-vps.sh \
            vps:"$DEPLOY_DIR/scripts/"

      # ── 5. Run the deploy on the VPS ────────────────────────────────────
      - name: Run deploy script on VPS
        env:
          DEPLOY_DIR: ${{ inputs.deploy_dir }}
          GHCR_USER:  ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: |
          ssh vps "DEPLOY_DIR='$DEPLOY_DIR' GHCR_USER='$GHCR_USER' GHCR_TOKEN='$GHCR_TOKEN' \
                   bash '$DEPLOY_DIR/scripts/deploy-vps.sh'"

      # ── 6. Always tear the tunnel down ──────────────────────────────────
      - name: Tear down WireGuard tunnel
        if: always()
        run: |
          sudo wg-quick down /tmp/wg0.conf 2>/dev/null || true
          sudo rm -f /tmp/wg0.conf
